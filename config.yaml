#######################################################################################################
#######################################################################################################
  orion-v1:
    load_config:
      engine: ovgenai
      model_type: vlm
      model_path: /mnt/Ironwolf-4TB/Models/OpenVINO/Orion-26B-A4B-v1-int4-ov/
      device: GPU.1
