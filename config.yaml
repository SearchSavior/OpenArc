server:
  port:

# comma seperated list of model_name to load on startup

# from env
startup_models : ${OPENRARC_AUTOLOAD_MODELS}


models:
  # Each model entry nests its load-time fields under `load_config`. Model-level
  # request defaults (sampler_config and the per-model_type *_config blocks) are
  # siblings of load_config and are overridden per request:
  #     request-time  >  config.yaml  >  engine default
  qwen35-08b:
    load_config:
      engine: ovgenai
      model_type: vlm
      model_path: /mnt/Ironwolf-4TB/Models/OpenVINO/Qwen3.5/Qwen3.5-0.8B-int8_asym-ov/
      device: CPU
      tool_call_parser: qwen35
    runtime_config:
      PERFORMANCE_HINT: LATENCY
    scheduler_config:
      max_num_batched_tokens:
      num_kv_blocks:
      cache_size:
      num_linear_attention_blocks:
      cache_interval_multiplier:
      dynamic_split_fuse:
      enable_prefix_caching:
      use_cache_eviction:
      use_sparse_attention:
    sampler_config:
      temperature: 0.7
      top_k: 40
      top_p: 0.95
      repetition_penalty: 1.05
      max_tokens: 1024

  qwen3-8b-spec:
    load_config:
      engine: ovgenai
      model_type: vlm
      model_path: /mnt/Ironwolf-4TB/Models/OpenVINO/Qwen/Qwen3-8B-ShiningValiant3-int4-asym-ov
      device: GPU.0
      tool_call_parser: hermes
      draft_model_path: "/mnt/Ironwolf-4TB/Models/OpenVINO/Qwen/Qwen3-pruned-6L-from-0.6B-int8-ov"
      draft_device: "CPU"
      num_assistant_tokens: 5
    runtime_config:
      PERFORMANCE_HINT: LATENCY
    scheduler_config:
      max_num_batched_tokens:
      num_kv_blocks:
      cache_size:
      num_linear_attention_blocks:
      cache_interval_multiplier:
      dynamic_split_fuse:
      enable_prefix_caching:
      use_cache_eviction:
      use_sparse_attention:
    sampler_config:
      temperature: 0.7
      top_k: 40
      top_p: 0.95
      repetition_penalty: 1.05
      max_tokens: 1024
